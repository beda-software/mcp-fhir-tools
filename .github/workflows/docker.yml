name: Publish Docker images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker.yml"
      - "tx-tools/**"
      - "fhir-tools/**"
      - "au-fhir-tools/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: "Detect changed packages"
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ github.event_name == 'workflow_dispatch' && '["tx-tools","fhir-tools","au-fhir-tools"]' || steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            tx-tools:
              - ".github/workflows/docker.yml"
              - "tx-tools/**"
            fhir-tools:
              - ".github/workflows/docker.yml"
              - "fhir-tools/**"
            au-fhir-tools:
              - ".github/workflows/docker.yml"
              - "au-fhir-tools/**"

  docker:
    name: "Build and push ${{ matrix.package }}"
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.package }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_NAMESPACE }}/mcp-${{ matrix.package }}:latest
